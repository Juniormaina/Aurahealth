<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" role="img" aria-label="Aura Health">
  <defs>
    <linearGradient id="auraWordRing" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="38%" stop-color="#3B82F6"/>
      <stop offset="72%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="auraWordHalo" cx="50%" cy="50%" r="50%">
      <stop offset="42%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#A78BFA" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraWordCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1224" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#07101F" stop-opacity="1"/>
    </radialGradient>
    <filter id="auraWordGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="auraWordBeat" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(8,10) scale(1.56)">
    <circle cx="32" cy="32" r="30" fill="url(#auraWordHalo)"/>
    <circle cx="32" cy="32" r="21.5" fill="url(#auraWordCore)"/>
    <g filter="url(#auraWordGlow)">
      <circle cx="32" cy="32" r="22" fill="none" stroke="url(#auraWordRing)" stroke-width="3.25" stroke-linecap="round"/>
    </g>
    <path d="M12.5 32 H21.2 L23.4 32 L25.1 26.2 L27.4 36.8 L30.2 32 H32.2 L34.4 14.8 L37.2 49.2 L40.1 32 H41.8 L43.4 28.6 L45.2 32 H51.5" fill="none" stroke="#FF2D55" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#auraWordBeat)"/>
    <path d="M12.5 32 H21.2 L23.4 32 L25.1 26.2 L27.4 36.8 L30.2 32 H32.2 L34.4 14.8 L37.2 49.2 L40.1 32 H41.8 L43.4 28.6 L45.2 32 H51.5" fill="none" stroke="#FFFFFF" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34.4" cy="14.8" r="1.35" fill="#FFFFFF"/>
  </g>

  <text x="132" y="58" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#00205B" letter-spacing="-0.6">Aura</text>
  <text x="217" y="58" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#D97706" letter-spacing="-0.6">Health</text>
  <text x="132" y="82" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#666666">Daily Wellness &amp; Community Adherence</text>
</svg>
