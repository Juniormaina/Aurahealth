name: checks

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: API checks against production bundle
        run: BUNDLE=1 npm run check:security
      - run: npm run test:rules

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'aurahealth' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'aura-health-f478f' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Cloud Run from Dockerfile
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          source: ./
          flags: --allow-unauthenticated --port=8080
          env_vars: NODE_ENV=production,FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
      - name: Publish Firestore rules
        run: npx -y firebase-tools@14 deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Smoke Cloud Run URL
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/security-check.sh
      - name: Smoke PRODUCTION_URL
        if: vars.PRODUCTION_URL != ''
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: bash scripts/security-check.sh
